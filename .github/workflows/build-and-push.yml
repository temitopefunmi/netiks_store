name: Build and Push Containers

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:

  workflow_dispatch:
    inputs:
      version:
        description: "Tag to deploy, e.g. v1.1.0"
        required: true
        type: string
jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Web lint
        run: npm run lint:web

      - name: Prepare env file
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose config

  build:
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - web
          - gateway
          - identity-service
          - vendor-service
          - catalog-service
          - media-service
          - admin-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        env: 
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"

      - name: Build and Push image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}

          case "${{ matrix.service }}" in
            web)
              DOCKERFILE="infra/docker/web.Dockerfile"
              ;;
            gateway)
              DOCKERFILE="apps/gateway/Dockerfile"
              ;;
            identity-service)
              DOCKERFILE="services/identity-service/Dockerfile"
              ;;
            vendor-service)
              DOCKERFILE="services/vendor-service/Dockerfile"
              ;;
            catalog-service)
              DOCKERFILE="services/catalog-service/Dockerfile"
              ;;
            media-service)
              DOCKERFILE="services/media-service/Dockerfile"
              ;;
            admin-service)
              DOCKERFILE="services/admin-service/Dockerfile"
              ;;
          esac

          IMAGE="${{ vars.ACR_LOGIN_SERVER }}/netiks-store/${{ matrix.service }}"

          docker build \
            -f "$DOCKERFILE" \
            -t "$IMAGE:$SHORT_SHA" \
            .

          docker push "$IMAGE:$SHORT_SHA"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}

            docker tag "$IMAGE:$SHORT_SHA" "$IMAGE:$VERSION"
            docker tag "$IMAGE:$SHORT_SHA" "$IMAGE:latest"

            docker push "$IMAGE:$VERSION"
            docker push "$IMAGE:latest"
          fi

  deploy:
    needs: build

    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1

        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}

          script: |
            set -e

            cd ~/netiks_store

            VERSION="${{ inputs.version || github.ref_name }}"

            git fetch --tags origin
            git checkout --force "$VERSION"

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              pull

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              ps
